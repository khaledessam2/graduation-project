<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" (click)="cancel.emit()">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 bg-[#075392E0] rounded-t-2xl">
      <div class="flex items-center gap-2 text-white">
        <ion-icon [name]="editMode() ? 'create-outline' : 'person-add-outline'" class="text-xl"></ion-icon>
        <span class="font-semibold">{{ (editMode() ? 'ADMIN.EDIT_STUDENT' : 'ADMIN.ADD_STUDENT') | translate }}</span>
      </div>
      <button class="text-white opacity-75 hover:opacity-100 transition-opacity" (click)="cancel.emit()">
        <ion-icon name="close-outline" class="text-2xl"></ion-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-5 space-y-4">
      @if (formError()) {
        <div class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm">
          <ion-icon name="alert-circle-outline" class="text-base shrink-0"></ion-icon>
          {{ formError() | translate }}
        </div>
      }

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.STUDENT_ID' | translate }} <span class="text-red-500">*</span></label>
          <input type="text"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            [placeholder]="'ADMIN.STUDENT_ID_PLACEHOLDER' | translate"
            [ngModel]="form().studentId" (ngModelChange)="update('studentId', $event)" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.YEAR' | translate }}</label>
          <select
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition bg-white"
            [ngModel]="form().year" (ngModelChange)="update('year', $event)"
          >
            @for (opt of yearOptions(); track opt.value) {
              <option [value]="opt.value">{{ opt.labelKey | translate }}</option>
            }
          </select>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.NAME' | translate }} <span class="text-red-500">*</span></label>
        <input type="text"
          class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
          [placeholder]="'ADMIN.STUDENT_NAME_PLACEHOLDER' | translate"
          [ngModel]="form().name" (ngModelChange)="update('name', $event)" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.EMAIL' | translate }}</label>
        <input type="email"
          class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
          [placeholder]="'ADMIN.EMAIL_PLACEHOLDER' | translate"
          [ngModel]="form().email" (ngModelChange)="update('email', $event)" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.DEPARTMENT' | translate }} <span class="text-red-500">*</span></label>
        <input type="text"
          class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
          [placeholder]="'ADMIN.DEPARTMENT_PLACEHOLDER' | translate"
          [ngModel]="form().department" (ngModelChange)="update('department', $event)" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.GPA' | translate }}</label>
          <input type="number" min="0" max="4" step="0.01"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            placeholder="0.00"
            [ngModel]="form().gpa" (ngModelChange)="update('gpa', $event)" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.PASSED_HOURS' | translate }}</label>
          <input type="number" min="0"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            placeholder="0"
            [ngModel]="form().passedHours" (ngModelChange)="update('passedHours', $event)" />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100">
      <button
        class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors disabled:opacity-50"
        [disabled]="saving()"
        (click)="cancel.emit()"
      >{{ 'ADMIN.CANCEL' | translate }}</button>
      <button
        class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#075392E0] hover:bg-[#054f87] transition-colors disabled:opacity-60 flex items-center gap-2"
        [disabled]="saving()"
        (click)="save.emit()"
      >
        @if (saving()) {
          <ion-icon name="refresh-outline" class="animate-spin"></ion-icon>
        }
        {{ 'ADMIN.SAVE' | translate }}
      </button>
    </div>

  </div>
</div>
