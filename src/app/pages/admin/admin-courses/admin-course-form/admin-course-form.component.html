<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" (click)="cancel.emit()">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 bg-[#075392E0] rounded-t-2xl">
      <div class="flex items-center gap-2 text-white">
        <ion-icon [name]="editMode() ? 'create-outline' : 'add-circle-outline'" class="text-xl"></ion-icon>
        <span class="font-semibold">{{ (editMode() ? 'ADMIN.EDIT_COURSE' : 'ADMIN.ADD_COURSE') | translate }}</span>
      </div>
      <button class="text-white opacity-75 hover:opacity-100 transition-opacity" (click)="cancel.emit()">
        <ion-icon name="close-outline" class="text-2xl"></ion-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-5 space-y-4">
      @if (formError()) {
        <div class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm">
          <ion-icon name="alert-circle-outline" class="text-base shrink-0"></ion-icon>
          {{ formError() | translate }}
        </div>
      }

      <div class="grid grid-cols-3 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.CODE' | translate }} <span class="text-red-500">*</span></label>
          <input type="text"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            [placeholder]="'ADMIN.CODE_PLACEHOLDER' | translate"
            [ngModel]="form().code" (ngModelChange)="update('code', $event)" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.HOURS' | translate }} <span class="text-red-500">*</span></label>
          <input type="number" min="1" max="6"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            [ngModel]="form().creditHours" (ngModelChange)="update('creditHours', $event)" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.LEVEL' | translate }}</label>
          <input type="number" min="1" max="6"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            [ngModel]="form().level" (ngModelChange)="update('level', $event)" />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.COURSE_NAME' | translate }} <span class="text-red-500">*</span></label>
        <input type="text"
          class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
          [placeholder]="'ADMIN.NAME_PLACEHOLDER' | translate"
          [ngModel]="form().name" (ngModelChange)="update('name', $event)" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.PROFESSOR' | translate }} <span class="text-red-500">*</span></label>
        <input type="text"
          class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
          [placeholder]="'ADMIN.PROFESSOR_PLACEHOLDER' | translate"
          [ngModel]="form().professor" (ngModelChange)="update('professor', $event)" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.PREREQUISITES' | translate }}</label>
          <input type="text"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            [placeholder]="'ADMIN.PREREQ_PLACEHOLDER' | translate"
            [ngModel]="form().prerequisites" (ngModelChange)="update('prerequisites', $event)" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.CAPACITY' | translate }} <span class="text-red-500">*</span></label>
          <input type="number" min="1"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#075392E0] focus:ring-2 focus:ring-[#07539220] transition"
            [ngModel]="form().capacity" (ngModelChange)="update('capacity', $event)" />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-600">{{ 'ADMIN.STATUS' | translate }}</label>
        <div class="flex gap-3">
          @for (opt of statusOptions(); track opt.value) {
            <label
              class="flex-1 flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl border text-sm font-medium cursor-pointer transition"
              [class.border-[#075392E0]]="form().status === opt.value"
              [class.bg-[#F4F9FF]]="form().status === opt.value"
              [class.text-[#075392E0]]="form().status === opt.value"
              [class.border-slate-200]="form().status !== opt.value"
              [class.text-slate-500]="form().status !== opt.value"
            >
              <input type="radio" class="hidden" [value]="opt.value"
                [ngModel]="form().status" (ngModelChange)="update('status', $event)" />
              {{ opt.labelKey | translate }}
            </label>
          }
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100">
      <button
        class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors disabled:opacity-50"
        [disabled]="saving()"
        (click)="cancel.emit()"
      >{{ 'ADMIN.CANCEL' | translate }}</button>
      <button
        class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#075392E0] hover:bg-[#054f87] transition-colors disabled:opacity-60 flex items-center gap-2"
        [disabled]="saving()"
        (click)="save.emit()"
      >
        @if (saving()) {
          <ion-icon name="refresh-outline" class="animate-spin"></ion-icon>
        }
        {{ 'ADMIN.SAVE' | translate }}
      </button>
    </div>

  </div>
</div>
