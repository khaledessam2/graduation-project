<aside
  class="fixed inset-y-0 start-0 z-30 bg-white border-e border-slate-200 flex-col py-6 overflow-y-auto lg:flex lg:sticky lg:top-0 lg:h-screen lg:z-auto transition-all duration-300"
  [class.hidden]="!layout.sidebarOpen()"
  [class.flex]="layout.sidebarOpen()"
  [class.w-64]="!layout.sidebarCollapsed()"
  [class.w-16]="layout.sidebarCollapsed()"
>
  <!-- Brand -->
  <div class="px-3 mb-8 flex flex-col items-center gap-3 overflow-hidden">
    @if (!layout.sidebarCollapsed()) {
      <img src="assets/images/logo.png" alt="UniSmart" class="w-32 mb-5 object-contain" onerror="this.style.display='none'" />
      <div class="flex items-center gap-2 text-[#075392E0]">
        <ion-icon name="book-outline" class="text-xl"></ion-icon>
        <span class="text-lg font-bold">UniSmart</span>
      </div>
    } @else {
      <div class="flex items-center justify-center text-[#075392E0]">
        <ion-icon name="book-outline" class="text-2xl"></ion-icon>
      </div>
    }
  </div>

  <!-- Nav links -->
  <nav class="flex-1 flex flex-col gap-1 px-2">
    @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-50 !text-primary font-semibold"
        [title]="layout.sidebarCollapsed() ? (item.labelKey | translate) : ''"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 text-sm font-medium hover:bg-blue-50 hover:text-primary transition-all"
        [class.justify-center]="layout.sidebarCollapsed()"
        (click)="layout.close()"
      >
        <ion-icon [name]="item.icon + '-outline'" class="text-lg shrink-0"></ion-icon>
        @if (!layout.sidebarCollapsed()) {
          <span>{{ item.labelKey | translate }}</span>
        }
      </a>
    }
  </nav>

  <!-- Logout -->
  <div class="px-2 mt-4 pt-4 border-t border-slate-100" [class.flex]="layout.sidebarCollapsed()" [class.justify-center]="layout.sidebarCollapsed()">
    <button
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 text-sm font-medium hover:bg-red-50 hover:text-red-600 transition-all"
      [class.justify-center]="layout.sidebarCollapsed()"
      [title]="layout.sidebarCollapsed() ? ('SIDEBAR.LOGOUT' | translate) : ''"
      (click)="logout()"
    >
      <ion-icon name="log-out-outline" class="text-lg shrink-0"></ion-icon>
      @if (!layout.sidebarCollapsed()) {
        <span>{{ 'SIDEBAR.LOGOUT' | translate }}</span>
      }
    </button>
  </div>
</aside>
